<!DOCTYPE html>
<html>
<head>
    <title>Days of Week</title>
</head>
<body>

    <p id="demo"></p>

    <script>
        let day= 4;
        let name; 

        switch (day) {
            case 1:
                name = "Monday";
                break;

            case 2:
                name = "Tuesday";
                break;

            case 3:
                name = "Wednesday";
                break;

            case 4:
                name = "Thursday";
                break;

            case 5:
                name = "Friday";
                break;

            case 6:
                name = "Saturday";
                break;

            case 7:
                name = "Sunday";
                break;

            default:
                name = "Invalid day";
        }

        document.getElementById("demo").innerHTML = name;
    </script>

</body>
</html>
