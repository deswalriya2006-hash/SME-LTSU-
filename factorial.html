<!DOCTYPE html>
<html>
    <body>
        <h1>javascript loops</h1>
        <h2>the for loop</h2>
        <p id="demo"> the for loop</p>
        <script>
            let n=prompt("enter the number:");
            let fact=1;
            for(let i=1;i<=n;i++ ){
               fact=fact*i;
            }
            document.getElementById("demo").innerHTML=fact;
        </script>
    </body>
</html>
