<!DOCTYPE html>
<html>
    <body>
        <h1>javascript loops</h1>
        <h2>the for loop</h2>
        <p id="demo"> the fibaconni series</p>
        <script>
            let n=8;
            let a=0, b=1, c;
        
            for(let i=1;i<=n;i++ ){
            document.getElementById("demo").innerHTML+=""+a;
            c=a+b;
            a=b;
            b=c;
            }
        </script>
    </body>
</html>
