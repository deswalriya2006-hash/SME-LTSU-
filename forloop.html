<!DOCTYPE html>
<html>
    <body>
        <h1>javascript loops</h1>
        <h2>the for loop</h2>
        <p id="demo"> the for loop</p>
        <script>
            let num=prompt("enter the num:")
            let text ="";
            for(let i=1;i<=10;i++ ){
                text+= num+"*"+i+"="+(num*i)+"<br>";
            }
            document.getElementById("demo").innerHTML=text;
        </script>
    </body>
</html>
