  
<!DOCTYPE html>
<html>
<head>
    <title>Lamrin tech skills university</title>

    <style>
        body {
            font-family: Arial;
            background: #e6e6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 320px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #faefe6;
            color: rgb(167, 12, 12);
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        a {
            color: #ad8344;
            text-decoration: none;
        }
    </style> 
</head>

<body>

    <div class="box">

        <h1>ltsu</h1>
        <p>Welcome to the University Portal</p>

        <form>
            <input type="text"
                   placeholder="Username or Roll Number"
                   required>

            <input type="password"
                   placeholder="Enter Password"
                   required>

            <p style="text-align: right;">
                <a href="#">Forgot Password?</a>
            </p>

            <button type="submit">LOGIN</button>
        </form>

        <p>New student?</p>

        <a href="signup.html">Create an Account</a>

    </div>

</body>
</html>
