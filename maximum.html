<!DOCTYPE html>
<html>
<body>

<h2>Find Maximum Value</h2>

<script>
let arr = [10, 5, 20, 3, 15];
let max = arr[0];

for (let i = 1; i < arr.length; i++) {
    if (arr[i] > max) {
        max = arr[i];
    }
}

document.write("Maximum value = " + max);
</script>

</body>
</html>
