<!DOCTYPE html>
<html>
<body>

<h2>Find Minimum Value</h2>

<script>
let arr = [10, 5, 20, 3, 15];
let min = arr[0];

for (let i = 1; i < arr.length; i++) {
    if (arr[i] < min) {
        min = arr[i];
    }
}

document.write("Minimum value = " + min);
</script>

</body>
</html>
