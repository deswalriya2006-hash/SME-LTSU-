<!DOCTYPE html>
<html>
<head>
    <title>Smart Canteen Meal Planner</title>
</head>
<body>

    <h1>Smart Canteen Meal Planner</h1>

    <h3>Available Food Items</h3>

    <p>1. Burger - ₹80</p>
    <p>2. Sandwich - ₹60</p>
    <p>3. Pizza - ₹120</p>
    <p>4. French Fries - ₹50</p>
    <p>5. Cold Coffee - ₹70</p>

    <label>Enter your budget (₹):</label>
    <input type="number" id="budget">
    <br><br>

    <label>How many food items do you want?</label>
    <input type="number" id="quantity">
    <br><br>

    <button onclick="calculateBill()">Calculate Bill</button>

    <h3>Bill Details</h3>
    <p id="result"></p>

    <script src="script.js"></script>

</body>
</html>
