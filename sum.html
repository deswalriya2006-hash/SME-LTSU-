<!DOCTYPE html>
<html>
    <body>
        <h1>javascript loops</h1>
        <h2>the for loop</h2>
        <p id="demo"> the for loop</p>
        <script>
            let sum=0;
            for(let i=1;i<=100;i++ ){
                sum=sum+i;
            }
            document.getElementById("demo").innerHTML=sum;
            
        
        </script>
    </body> 
</html>
