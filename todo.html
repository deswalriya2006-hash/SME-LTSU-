<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Manager</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <p>Plan your work. Track your progress.</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
        </div>

        <section class="panel">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <label for="taskTitle">Task Name</label>
                <input type="text" id="taskTitle"
                    placeholder="Example: Complete JavaScript homework"
                    required maxlength="150">

                <div class="form-row">
                    <div>
                        <label for="taskDate">Due Date</label>
                        <input type="date" id="taskDate">
                    </div>

                    <div>
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="addButton">+ Add Task</button>
            </form>
        </section>

        <section class="panel">
            <h2>My Tasks</h2>

            <div class="toolbar">
                <input type="search" id="searchTask"
                    placeholder="Search tasks...">

                <select id="filterTask">
                    <option value="All">All Tasks</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>

                <button type="button" id="loadApiButton" class="secondary">
                    Load API Tasks
                </button>
            </div>

            <p id="message" role="status" aria-live="polite"></p>
            <div id="taskList"></div>
        </section>

        <footer>
            <p>Tasks are saved in this browser using Local Storage.</p>
        </footer>
    </div>

    <script src="todo.js"></script>
</body>
</html>
